<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Balancing Calculator</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Balance Lab</h1><p>Experiment with combat stats, progression, and item pricing.</p></div></header><div class="grid"><section class="panel"><h2>Combat damage</h2><div class="controls"><label>Base damage<input id="damage" type="number" min="0" value="35"></label><label>Multiplier<input id="mult" type="number" min="0" step="0.1" value="1.5"></label><label>Armor %<input id="armor" type="number" min="0" max="100" value="20"></label></div><p>Final damage</p><div class="stat" id="damageOut"></div></section><section class="panel"><h2>Level progression</h2><div class="controls"><label>Base XP<input id="xp" type="number" min="1" value="100"></label><label>Growth factor<input id="growth" type="number" min="1" step="0.05" value="1.25"></label><label>Target level<input id="level" type="number" min="1" max="100" value="10"></label></div><p>XP to reach target level (cumulative)</p><div class="stat" id="xpOut"></div></section><section class="panel"><h2>Item pricing</h2><div class="controls"><label>Base price<input id="price" type="number" min="0" value="250"></label><label>Rarity multiplier<input id="rarity" type="number" min="0" step="0.25" value="3"></label><label>Discount %<input id="discount" type="number" min="0" max="100" value="10"></label></div><p>Final item price</p><div class="stat" id="priceOut"></div></section></div><section class="panel"><h2>Progression preview</h2><table><thead><tr><th>Level</th><th>XP for next level</th><th>Cumulative XP</th></tr></thead><tbody id="levels"></tbody></table></section><footer>Open-source demo • Runs locally in your browser</footer><script src="app.js"></script></main></body></html>
